name: Android build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: JVM and Robolectric tests
        if: always()
        run: ./gradlew test --continue

      - name: Test summary
        if: always()
        run: |
          for f in $(find . -path "*/test-results/*" -name "TEST-*.xml"); do
            grep -o '<testsuite [^>]*' "$f" | sed -E 's/.*name="([^"]+)".*tests="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/\1 tests=\2 failures=\3 errors=\4/'
          done
          grep -h -A3 "<failure" $(find . -path "*/test-results/*" -name "TEST-*.xml") | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm-bible-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
